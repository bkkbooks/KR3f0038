body:
  text: 夏侯陽算經卷上眀乘除法夏侯陽曰夫算之法約省為善有分者通之分不均者同之位髙者下之可約者約之耦則半之五則倍而折之一三七九商用所宜於此不得乃為之命分分母入者須出之然後為定子可半者半之不可半者倍母而入之此算之要道也凡除分者全數易了奇殘難用心意之勞正在於此後當隨事釋之其物殘分求尺尺之求寸皆上十之斤之求兩二而八之兩之求銖三而八之銖之求絫黍皆上十之斗之求升合勺撮皆上十之里之求步三百之步之求尺六之釐毫絲忽可以意知夫乘除之法先眀九九一從十橫百立千僵千十相望萬百相當滿六已上五在上方六不積算五不單張上下相乘實居中央言十自過不滿自當以法除之宜得上商從算相似橫算相當以次右行極於左方言步之上見十步至十見百步至百見千步至千見萬步至萬悉觀上數以安下位上不滿十下不滿一步隨多少以為楷式以少呼多因法為母積實為子二分之一為中半三分之二為太半三分之一為少半四分之一為弱半此漏刻之數也凡算者有五乘五除除者散繁除約乃以除減為名乘者令少乘多乃以乘長為稱乘盈除縮故曰乘除也一曰法除上下置位以少呼多言十自過不滿自當實居中央故曰法除也二曰步除如斛中求斗斗中求升升中求合合中求勺勺中求抄及丈中求尺尺中求寸寸中求分皆言上十之上百之故曰步除也三曰約除如等數所得者約實約法各得分數故曰約除也四曰開平方除借一算為下法步之超一位冪方十其積有百冪方百其積有萬至百言十至萬言百故曰開平方除也五曰開立方除借一算為下法步之超二位立方十其積有千立方百其積有百萬至千言十至百萬言百故曰開立方除也時務云十乘加一等百乘加二等千乘加三等萬乘加四等十除退一等百除退二等千除退三等萬除退四等辨度量衡田曹云度之所起起於忽十忽為一絲十絲為一毫十毫為一釐十釐為一分十分為一寸十寸為一尺十尺為一丈十丈為一引四丈為一匹五丈為一端六尺為一步二百四十步為一畝三百步為一里倉曹云量之所起起於粟十粟為一圭十圭為一撮十撮為一抄十抄為一勺十勺為一合十合為一升十升為一斗十斗為一斛金曹云稱之所起起於黍十黍為一絫十絫為一銖二十四銖為一兩十六兩為一斤三十斤為一鈞四鈞為一石漢書律曆志曰度者所以度長短本起於黃鍾之長以子穀秬黍中者一黍之廣度之九十分黃鍾之長一黍為分十分為寸十寸為尺十尺為丈十丈為引而五度審矣量者所以量多少本起於黃鍾之籥用度數審其容以子穀秬黍中者千二百實其籥合籥為合十合為升十升為斗十斗為斛而五量嘉矣權者所以稱物平施知輕重本起於黃鍾之重一籥容千二百黍重十二銖二十四銖為兩十六兩為斤三十斤為鈞四鈞為石而五權謹矣兩者兩黃鍾之重二十四銖象二十四氣十六兩為斤象四時乘四方三十斤為鈞象一月四鈞為石象四時也權與物鈞而生衡謂錘與物鈞所稱適停時衡平也衡運生規規圓生矩矩方生繩繩直生準立凖以望繩以水為平也是為五則規者所以規圓器械令得其類也矩者所以矩方器械令不失其形也規矩相須陰陽位序圓方乃成準者所以揆平取正也繩者上下端直經緯四通也準繩連體權衡合德百工繇焉以定法式已上古法在京諸司及諸州各給稱尺并五尺度斗升合等樣皆用銅為之倉庫令諸量函所在官造大者五斛中者三斛小者一斛以鐵為緣勘平印書然後給用以上今時用之也已言斛法不同課租庸調賦役令諸戶一丁租粟二斛其調各隨鄉土所出絹絁各二丈布二丈五尺輸絹絁者綿三兩輸布者麻三斤若當戶不成端匹屯綟者皆丈尺折半之求庸七丈五尺法置丁數三因之折半丈尺折半之又法置丁數以七丈五尺為法乘之以五丈除之不滿為奇丁丈尺他皆放此又法重張丁數下位退一等五因之以添上位丈尺折半又法置丁數三而五之丈尺折半之凡年中除閏月外有二月謂五月十月一云九月為農事之月免庸若役五十日租庸調並免他皆放此求每丁閏有二尺五寸法置丁數退二等五因之丈尺折半之求有閏年每丁布二端二丈二尺五寸法置丁數七而七之退一等折半丈尺折半之又法置丁數以二百四十五乘之退二等丈尺折半之求庸閏布每丁一端三丈二尺五寸法重置丁數各三因之下位退一等添上位訖半之其丈尺已下更半之求無閏年每丁布二端一丈五尺法重置丁數上位二因之下位退一等三因之丈尺折半添上位又法置丁數以二十三乘退一等丈尺折半之求每丁調綟布四丈法置丁數八因退一等丈尺折半之求每丁閏年庸調布二端二丈二尺五寸法列置丁數三位上位二因端也中位退一等四因丈也下位退二等五因尺也丈尺半之百丁已上不折半并三位即都數若每丁庸調并賸布二丈五尺都當二端二丈五尺亦列丁數二位上位二因端也下位退一等五因丈也奇丁丈尺折半之并二位得都數若每丁庸調并賸布一尺六寸七分都當二端一丈六尺六寸七分亦列丁數五位上位二因端也次位退一等三因丈也次位退二等三因尺也次位退三等三因寸也下位退四等四因分也奇丁丈尺折半之并得都數凡算布從丈尺已下皆倍本因之數論步數不等田曹以六尺為步三百步為一里此古法雜令諸度地以五尺為一步三百六十步為一里田令諸田廣一步長二百四十步為畝畝百為頃此今用之方田四方平等名曰方田術曰方自乘為積步以畝法除之直田從長而廣狹故曰直田術曰以從廣相乘為積步以畝法除之腰鼓田形似腰鼓細術曰并三廣以三而一乘長為積步以畝法除之圓田形如鼓面術曰周自乘以十二而一得積步又術周乘徑四而一亦得又術半周乘半徑亦得各得積步並以畝法除之環田此外周而心空如環術曰并外內周而半之以徑乘為積步以畝法除之丸田形如覆半彈丸術曰徑乘周四而一得積步以畝法除之圭田三角之田術曰半長乘廣為積步以畝法除之弓田形如弓樣術曰矢乘弦矢又自乘并之二而一以畝法除之箕田一頭廣一頭狹術曰并二廣而半之以乘長為積步以畝法除之四不等田二廣二長不齊術曰并二長而半之又并二廣而半之相乘為積步以畝法除之七今有田二十一頃七十八畝一百八十步問為方幾何答曰七百二十三步奇百七十一步術曰先置頃畝於上以二百四十步乘之得五十二萬二千七百二十步內零一百八十步以開方除之借一算為下法步之超一位至百止萬上置上商七百下亦置七萬於實位之下下法之上名曰方法命上商除實訖倍方為一十四萬方法一退下法再退又置上商二十於前商後又置二百於方法之下下法之上名曰隅法以方隅二法皆命上商以除實訖倍隅法為四百從上方法一退下法再退又置上商三於前商二十之後又置三步於方法之下下法之上名曰隅法以方隅二法皆命上商除實訖倍隅法得六從上方法得一千四百四十六即是上方得七百二十三步奇一百七十一步變米榖倉庫令云其折糙米者稻三斛折納糙米一斛四斗若榖求米法十四乘三除除畢以米數折退一等又法四二乘九除一四乘三除二八乘六除若米求穀法三乘十四除又法九乘四二除三乘一四除六乘二八除粟五斗為糲米三斗三十乘之五十而一為稗米二斗七升二十七乘之五十而一為糳米二斗四升二十四乘之五十而一為御米二斗一升二十一乘之五十而一八今有粟五千五百一十斛九斗欲每斛為糲米六斗稗米五斗四升糳米四斗八升御米四斗二升問各幾何答曰糲米三千三百六斛五斗四升稗米二千九百七十五斛八斗八升六合糳米二千六百四十五斛二斗三升二合御米二千三百一十四斛五斗七升八合術曰置粟退一等以六斗乘為糲米以五斗四升乘為稗米以四斗八升乘為糳米以四斗二升乘為御米返求粟法置糲米數以五因之三除之置稗米數以上十之以五斗四升除之糳米御米各以本米數除之皆得本粟九今有榖一千八百四十三斛八斗三升欲依租變米每穀三斛為米一斛四斗問合得米幾何答曰八百六十斛四斗五升四合術曰置穀數以一斛四斗為法乘之以三斛為法除之得米數
