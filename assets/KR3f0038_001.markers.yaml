  - {type: variant, offset: 1250, length: 0, content: '', WYG: 倉曹云古者鑿地方一尺深一尺六寸二分受粟一斛至漢王莽改鑄銅斛用深一尺九寸二分至宋元嘉二年徐受重鑄用二尺三寸九分至梁大同元年甄鸞校之用二尺九寸二分然時異事變斗尺不同以古就今臨時校定始可行用若欲審之以掘地作穴方廣三尺已下以今時用斗量米一斛置諸穴中㮣令平滿如有少賸臨時増減取米適平然後出之徑量以知深淺乃可以為斛法定數今有方窖長一丈三尺廣六尺深一丈問受粟幾何答曰四百八十一斛四斗八升二十七分升之四術曰置長尺數以廣尺數乗之又以深乗之得積尺以斛法除之即粟數凡斛法一尺六寸二分今有圓篅周三丈髙一丈六尺問受粟幾何答曰七百四十斛七斗四升二十七分升之二術曰置周尺數自相乗以髙數乗之十二而一得積尺以斛法除之即粟數今有平地聚粟下周三丈髙四尺問受粟幾何答曰六十一斛七斗二升八十一分升之六十八術曰置周尺數自相乗以髙乗之三十六而一得積尺以斛法除之即粟􅁆今有倉南北一丈五尺東西三丈五尺髙八尺問受粟幾何答曰二千五百九十二斛五斗九升二十七分升之七術曰以東西南北丈尺相乗又以髙乗之得積尺以斛法除之即粟數今有倉廣二丈六尺長三丈四尺深一丈二尺中有二柱長一丈二尺圓三尺牽二枚長二丈六尺方五寸梁二枚長二丈六尺方三尺問受粟幾何答曰六千二百四十斛一斗二升八十一分升之二十八術曰置廣長相乗以其深乗得一萬六百八尺柱圓三尺自相乗得九尺以乗其長得一百八尺倍之得二百一十六尺以十二除之得一十八尺牽方自相乗退位得二寸五分復乗其長得六尺五寸倍之得一十三尺梁方自乗得九尺復乗其長得二百三十四尺倍之得四百六十八尺并柱牽梁案原本脱梁字今據上文補得四百九十九尺以減大數餘一萬一百九尺以斛法除之即粟數今有方倉長三十一丈六尺廣七十二尺髙一十七尺中有九柱各圓三尺五寸長十七尺又有六柱各方二尺八寸長十七尺梁三枚長三十二尺厚廣二尺牽三枚案牽下原本衍方字今刪長三十二尺各方七寸問受粟幾何答曰二十三萬七千八百九十九斛四十三升五十四分升之五十三術曰置長廣相乗以髙乗為實圓柱自乗以乘長十二而一九因之為實方柱自乗以乗長六因之為實梁厚廣相乗以乗長三因之為實牽方自乗以乗長三因之為實并柱梁牽等減倉實尺以斛法除之即粟數}
