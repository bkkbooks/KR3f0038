  - {type: variant, offset: 486, length: 0, content: '', WYG: 夏侯陽算經原序夫博通九經為儒門之首學該六藝為伎術之宗若非材性通眀孰能與於此也然算數起自伏犧而黄帝定三數為十等隸首因以著九章逮乎有虞乃同律度量衡孔子曰謹權量審法度漢備五數紀於一協於十長於百大於千衍於萬度長短者不失毫氂量多少者不失抄撮權輕重者不失黍絫五曹孫子述作滋多甄鸞劉徽為之詳釋稽之往古妙絶其能儲校今時少有聞見余以總角志好其文畧尋古今備覽差互其如眀數造術詎曉端倪尋考遺言頗知梗㮣且課租庸調無術可憑步數奇殘苦難銷盡求變米穀經旨未贍正耗共升何由剖析三分五分取一法理為眀焉况今令式與古數不同奚能則定代相沿革互議短長經術尤深難可意測是以跋涉川陸參㑹宗流纂定研精刋繁就省袪蕩疑惑括諸古法燭盡毫芒謹錄異同列之於左}
