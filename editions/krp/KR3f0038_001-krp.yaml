body:
  text: 夏侯陽算經卷上眀乘除法夏侯陽曰夫算之法約省為善有分者通之分不均者同之位髙者下之可約者約之耦則半之五則倍而折之一三七九商用所宜於此不得乃為之命分分母入者湏出之然後為定子可半者半之不可半者倍母而入之此算之要道也凡除分者全數易了竒殘難用心意之勞正在於此後當隨事釋之其物殘分求尺尺之求寸皆上十之斤之求兩二而八之兩之求銖三而八之銖之求絫黍皆上十之斗之求升合抄撮皆上十之里之求步三百之步之求尺六之氂毫絲忽可以意知夫乗除之法先眀九九一從十横百立千僵千十相望萬百相當滿六已上五在上方六不積算五不單張上下相乗實居中央言十自過不滿自當以法除之宜得上商從算相似横算相當以次右行極於左方言法之上見十步至十見百步至百見千步至千見萬步至萬悉觀上數以安下位上不滿十下不滿一步隨多少以為楷式以少呼多因法為母積實為子二分之一為中半三分之二為太半三分之一為少半四分之一為弱半此漏刻之數也凡算者有五乗五除除者散繁除約乃以除減為名乗者令少乗多乃以乗長為稱乗盈除縮故曰乗除也一曰法除上下置位以少呼多言十自過不滿自當實居中央故曰法除也二曰步除如斛中求斗斗中求升升中求合合中求勺勺中求抄及丈中求尺尺中求寸寸中求分皆言上十之上百之故曰步除也三曰約除如等數所得者約實約法各得分數故曰為除也四曰開平方除借一算為下法步之超一位幂方十其積有百幂方百其積有萬至百言十至萬言百故曰開平方除也五曰開立方除借一算為下法步之超二位立方十其積有千立方百其積有百萬至千言十至百萬言百故曰開立方除也時務云十乗加一等百乗加二等千乗加三等萬乗加四等十除退一等百除退二等千除退三等萬除退四等辯度量衡田曹云度之所起起於忽十忽為一絲十絲為一毫十毫為一氂十氂為一分十分為一寸十寸為一尺十尺為一丈十丈為一引四丈為一匹五丈為一端六尺為一步二百四十步為一畞三百步為一里倉曹云量之所起起於粟十粟為一圭十圭為一撮十撮為一抄十抄為一勺十勺為一合十合為一升十升為一斗十斗為一斛金曹云稱之所起起於黍十黍為一絫十絫為一銖二十四銖為一兩十六兩為一斤三十斤為一鈞四鈞為一石漢書律厯志曰度者所以度長短本起於黄鍾之長以子穀秬黍中者一黍之廣度之九十分黄鍾之長一黍為分十分為寸十寸為尺十尺為丈十丈為引而五度審矣量者所以量多少本起於黄鍾之龠用度數審其容以子穀秬黍中者千二百實其龠十龠為合十合為升十升為斗十斗為斛而五量嘉矣權者所以稱物平施知輕重本起於黄鍾之重一龠容千二百黍重十二銖二十四銖為兩十六兩為斤三十斤為鈞四鈞為石而五權謹矣兩者黄鍾之重二十四銖象二十四氣十六兩為斤象四時乗四方三十斤為鈞象一月四鈞為石象四時也權與物均而生衡謂重與物均所稱適停時衡平也衡運生規規圓生矩矩方生繩繩直生準立凖以望䋲以水為平也是為五則規者所以規圓器械令得其類也矩者所以矩方器械令不失其形也規矩相須陰陽位序圓方乃成準者所以揆平取正也繩者上下端直經緯四通也準繩連體權衡合徳百工繇焉以定法式以上古法在京諸司及諸州各給稱尺并五尺度斗升合等様皆銅為之倉庫令諸量函所在官造大者五斛中者三斛小者一斛以鐵為縁勘平印書然後給用以上今時用之也言斛法不同倉曹云古者鑿地方一尺深一尺六寸二分受粟一斛至漢王莽改鑄銅斛用深一尺九寸二分至宋元嘉二年徐受重鑄用二尺三寸九分至梁大同元年甄鸞校之用二尺九寸二分然時異事變斗尺不同以古就今臨時校定始可行用若欲審之以掘地作穴方廣三尺已下以今時用斗量米一斛置諸穴中㮣令平滿如有少賸臨時増減取米適平然後出之徑量以知深淺乃可以為斛法定數今有方窖長一丈三尺廣六尺深一丈問受粟幾何答曰四百八十一斛四斗八升二十七分升之四術曰置長尺數以廣尺數乗之又以深乗之得積尺以斛法除之即粟數凡斛法一尺六寸二分今有圓篅周三丈髙一丈六尺問受粟幾何答曰七百四十斛七斗四升二十七分升之二術曰置周尺數自相乗以髙數乗之十二而一得積尺以斛法除之即粟數今有平地聚粟下周三丈髙四尺問受粟幾何答曰六十一斛七斗二升八十一分升之六十八術曰置周尺數自相乗以髙乗之三十六而一得積尺以斛法除之即粟數今有倉南北一丈五尺東西三丈五尺髙八尺問受粟幾何答曰二千五百九十二斛五斗九升二十七分升之七術曰以東西南北丈尺相乗又以髙乗之得積尺以斛法除之即粟數今有倉廣二丈六尺長三丈四尺深一丈二尺中有二柱長一丈二尺圓三尺牽二枚長二丈六尺方五寸梁二枚長二丈六尺方三尺問受粟幾何答曰六千二百四十斛一斗二升八十一分升之二十八術曰置廣長相乗以其深乗得一萬六百八尺柱圓三尺自相乗得九尺以乗其長得一百八尺倍之得二百一十六尺以十二除之得一十八尺牽方自相乗退位得二寸五分復乗其長得六尺五寸倍之得一十三尺梁方自乗得九尺復乗其長得二百三十四尺倍之得四百六十八尺并柱牽梁案原本脱梁字今據上文補得四百九十九尺以減大數餘一萬一百九尺以斛法除之即粟數今有方倉長三十一丈六尺廣七十二尺髙一十七尺中有九柱各圓三尺五寸長十七尺又有六柱各方二尺八寸長十七尺梁三枚長三十二尺厚廣二尺牽三枚案牽下原本衍方字今刪長三十二尺各方七寸問受粟幾何答曰二十三萬七千八百九十九斛四十三升五十四分升之五十三術曰置長廣相乗以髙乗為實圓柱自乗以乘長十二而一九因之為實方柱自乗以乗長六因之為實梁厚廣相乗以乗長三因之為實牽方自乗以乗長三因之為實并柱梁牽等減倉實尺以斛法除之即粟數課租庸調賦役令諸戸一丁租粟二斛其調各隨鄉土所出絹䌳各二丈布二丈五尺輸絹䌳者綿三兩輸布者麻三斤若當戸不成端匹屯綟者皆丈尺折半之求庸七尺五寸法置丁數三因之折半丈尺折半之又法置丁數以七尺五寸為法乗之以五丈除之不滿為竒丁丈尺他皆倣此又法重張丁數下位退一等五因之以添上位丈尺折半又法置丁數三而五之丈尺折半之凡年終除閏月外有二月謂五月十月一云九月為農事之月免庸若役五十日租庸調竝免他皆放此求毎丁閏有二尺五寸法案毎丁下原本有布二端二尺五字係下文訛衍在此又脱閏有二字今據術刪補置丁數五因之丈尺折半之求有閏年毎丁布二端二丈二尺五寸法置丁數案此下原本有五因之丈尺折半之求有閏年毎丁布二端二丈二尺五寸置丁數凡二十六字即上文衍複在此今刪正七而七之退一等折半丈尺折半之案原本脱丈尺折半四字今據術補又法案原本脱法字今補置丁數以二百四十五乗之退二等丈尺折半之求庸閏布毎丁一端三丈二尺五寸法重置丁數各三因之下位退一等添頭位訖半之其丈尺以下更半之求無閏年毎丁布二端一丈五尺法重置丁數上位二因之下位退一等三因之丈尺折半添上位又法置丁數以二十三乗退一等丈尺折半之求毎丁調綟布四丈法置丁數八因退一等丈尺折半之求毎丁閏年庸調布二端二丈二尺五寸案此即上求有閏年毎丁布二端二丈二尺五寸法而立術各異又求毎下原本衍年字今刪正列置丁數之位頭位二因端也中位退一等四因丈也下位退二等五因尺也丈尺半之百丁已上不折半并三位即都數案此下原本有若毎丁因一位端也中退一等二因丈也下位退二等五因尺也奇丁丈尺折半三位即得凡三十六字係上下文衍複在此今刪正若毎丁庸調并賸布二丈五尺都當二端二丈五尺亦列丁數二位頭位二因端也下位退一等五因丈也奇丁丈尺折半之并二位得都數若毎丁庸調并賸布一尺六寸七分都當二端一丈六尺六寸七分亦列丁數五位頭位二因端也次位退一等三因丈也次位退二等三因尺也次位退三等三因寸也下位退四等四因分也奇丁丈尺折半之并得都數凡算布從丈尺以下皆倍本因之數論步數不等田曹以六尺為步三百步為一里此古法雜令諸度地以五尺為一步三百六十步為一里田令諸田廣一步長二百四十步為畞畞百為頃此今用之方田四方平等名曰方田術曰方自乗為積步以畞法除之直田從長而廣狭故曰直田術曰以從廣相乗為積步以畞法除之腰鼓田形似腰鼓細術曰并三廣以三而一乗長為積步以畞法除之圓田形如鼓面術曰周自乗以十二而一得積步又術周乗徑四而一亦得又術半周乗半徑亦得各得積步竝以畞法除之環田此外周而心空如環術曰并外内周而半之以徑乗為積步以畞法除之丸田形如覆半彈丸術曰徑乗周四而一得積步以畞法除之圭田三角之田術曰半長乗廣為積步以畞法除之弓田形如弓樣術曰矢乗弦矢又自乗并之二而一以畞法除之箕田一頭廣一頭狭術曰并二廣而半之以乗長為積步以畞法除之四不等田二廣二長不齊也術曰并二長而半之又并二廣而半之相乗為積步以畞法除之今有田二十一頃七十八畞一百八十步問為方幾何答曰七百二十三步奇百七十一步術曰先置頃畞於上以二百四十步乗之得五十二萬二千七百二十步内零一百八十步以開方除之借一算為下法步之超一位至百止萬上置上商七百下亦置七萬於實位之下下法之上命上商除實訖倍方為一十四萬方法一退下法再退又置上商二十於前商後又置二百於方法之下下法之上名曰隅法以方隅二法皆命上商以除實訖倍隅法為四百從上方法一退下法再退又置上商三扵前商二十之後又置三步於方法之下下法之上名曰隅法以方隅二法皆命上商除實訖倍隅法得六從上方法得一千四百四十六即是上方得七百二十三步奇一百七十一步變米榖倉庫令云其折糙米者稻三斛折納糙米一斛四斗若榖求米法十四乗三除除畢以米數折退一等又法四二乗九除一四乗三除案此句即上十四乗三除句複出二八乗六除若米求穀法三乗十四除又法九乗四二除三乗一四除案此句即上三乗十四除句複出六乗二八除粟五斗為糲米三斗三十乗之五十而一為粺米二斗七升二十七乗之五十而一為糳米二斗四升二十四乗之五十而一為御米二斗一升二十一乗之五十而一今有粟五千五百一十斛九斗欲毎斛為糲米六斗粺米五斗四升糳米四斗八升御米四斗二升問各幾何答曰糲米三千三百六斛五斗四升粺米二千九百七十五斛八斗八升六合糳米二千六百四十五斛二斗三升二合御米二千三百一十四斛五斗七升八合術曰置粟退一等以六斗乗為糲米以五斗四升乗為粺米以四斗八升乗為糳米以四斗二升乗為御米返求粟法置糲米數以五因之三除之置粺米數以上十之以五斗四升除之糳米各以本米數除之皆得本粟今有榖一千八百四十三斛八斗三升欲依租變米毎穀三斛為米一斛四斗問合得米幾何答曰八百六十斛四斗五升四合術曰置穀數以一斛四斗為法乗之以三斛為法除之得米數
