  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3f0038_WYG_003-1a, image: WYG0797/WYG0797-0243a.png}
body:
  text: 夏侯陽算經卷下說諸分今有黄金一斤直絹一千二百匹問毎兩直絹幾何答曰一兩直絹七十五匹術曰置絹數以一十六兩除之即得今有絲一百九十二兩問為銖幾何答曰四千六百八銖術曰置絲數以二十四乗之即得今有錦一匹直錢十八貫問丈尺寸各得幾何答曰一丈四貫五百文一尺四百五十文一寸四十五文術曰置錢數以四丈除之得丈價一退為尺價再退為寸價今有金一斤直錢一百貫問一兩幾何答曰一兩六貫二百五十文術曰置錢數以十六兩除之即得今有金一斤令五十人分之問人得幾何答曰人得七銖六絫八黍術曰置金一斤二而八之為兩三而八之為銖以人數除之即得今有絲三百二十四斤欲九兩為絹一匹問絹幾何答曰五百七十六匹術曰置絲斤數二而八之以九而一即得今有下戸欠錢一百二十三貫五百文準條扵上戸均攤今有上戸見在錢三萬一千二百五十貫文問合毎貫均著幾何答曰毎貫三文九分五氂二毫術曰置下戸錢數以上戸見在錢除之即得今有錢一十七貫五百二十五文欲五文買雞三隻問得幾何答曰得雞一萬五百一十五隻術曰置錢數以三因之五而一即得今有錢二貫四百文買錫一斤問兩銖絫各幾何答曰兩一百五十文銖六文二分五氂絫六分二氂五毫術曰置錢數以十六除之得兩價欲知銖價即置兩價以二十四除為銖價退銖價一等為絫價今有十五家共納兩稅錢一十貫文甲三人人各一貫文乙五人人各七百文丙七人人各五百文續奉符令都卻還七貫三百問隨元納數給付各幾何答曰甲三人各還七百三十文各有二百七十文在乙五人各還五百一十一文各有一百八十九文在丙七人各還三百六十五文各有一百三十五文在術曰置卻還數以百除之所得為毎百還錢之數置百文減之餘為毎百錢在庫之數各置此數以各人所納錢數乗之各得其數今有絹一千二百二十五匹三丈七尺五寸欲送州每匹一十五文充腳竝於身内抽給其絹時估毎匹一貫一百文問正及腳各幾何答曰正一千五百五匹一丈六尺三寸二百二十三分寸之一百五十一腳二十匹二丈一尺一寸二百二十三分寸之七十二術曰置絹數於丈尺已下折半五因以時估一貫一百文乗得一千六百七十八貫五百三十一文二分五氂復置一貫一百文加一十五文為法除得一千五百五匹不盡四百五十六文二分五氂進位四因之得一萬八千二百五十以下法除之得一丈六尺三寸不盡者與法退位倍之得二百二十三分寸之一百五十一欲知腳價者置元絹數丈尺寸折半五因又以腳錢一十五文乗之得二萬二千八百八十九文六氂二毫半以一貫一百一十五文為法除得二十匹不盡五百八十九文六氂二毫半進位四因之得二萬三千五百六十二文半以下法除之得二丈一尺一寸不盡者如前約之得二百二十三分寸之七十二今有絹一匹當腳一十五文問丈尺寸各幾何答曰丈三文七分五氂尺三分七氂五毫寸三氂七毫五絲術曰置腳價一十五文以四丈除之得一丈腳數退一等得尺再退得寸腳數今有絹一匹直一貫一百文問丈尺寸各幾何答曰丈二百七十五文尺二十七文五分寸二文七分五氂術曰置錢數以四丈除之得丈價一退得尺價再退得寸價今有米二千五百六十七斛五斗其米麤欲再舂毎八升耗一升問合得熟米幾何答曰熟米二千二百四十六斛五斗六升二合五勺術曰置米數以七因八除得數返求米以八因七除今有米一千五百三十二斛七斗欲貸與人毎八升加息一升問本息共幾何答曰一千七百二十四斛二斗八升七合五勺術曰置米數以九因八除之若求元數八因九除之今有兩稅錢二千貫文欲送州毎貫數内抽一十文充腳問正及腳各幾何答曰正一千九百八十貫一百九十八文一百一分文之二腳一十九貫八百一文一百一分文之九十九術曰置錢數下置一貫文又加腳十文為法除之得正數卻減都錢餘即腳錢今有紬五千六百二十五匹匹欲作複七條問合幾何答曰三萬九千三百七十五條術曰置紬數以七因之即得今有金方一寸重一斤有金方六寸問重幾何答曰二百一十六斤術曰置金寸數再乗之即得今有絹二千四百五十四匹每匹直錢一貫七百文問計錢幾何答曰四千一百七十一貫八百文術曰先置絹數七添之退位一等即得今有布一萬三千四百六十三端二丈五尺六寸毎端直錢一貫八百文問計錢幾何答曰二萬四千二百三十四貫三百二十一文六分術曰先置布數丈尺倍之從下八添直至數首退一等即得又術退位減一餘以二因之即得今有布積尺一萬八千四百六十三尺四寸二分問為端幾何答曰三百六十九端一丈三尺四寸二分術曰先置尺數以五十尺除之即得今有絹三千四百六十三匹一丈三尺四寸毎匹三貫五百文問計錢幾何答曰一萬二千一百二十一貫六百七十二文五分術曰先置絹數丈尺已下折半五因案原本脫此二字據四丈為一匹丈尺已下應以四丈除之書内用省算竝云折半五因今訂補以五七因之即得又術從頭七因訖折半即得今有絹積尺一萬三千四百六十三尺五寸四分問為匹幾何答曰三百三十六匹二丈三尺五寸四分術曰先置積尺數以匹四十尺為法除之即得今有絲一千五百二十五斤毎兩一百七十文問錢幾何答曰四千一百四十八貫術曰先置絲數以二八因之以兩價乗之即得又術添七亦得今有絲三千四百八十五兩令織紗一匹用絲五兩問得紗幾何答曰六百九十七匹術曰先置絲數以二因之退位一等即得又術以五兩除之即得今有絲一萬三千四百六十七兩問斤幾何答曰八百四十一斤一十一兩術曰置絲兩數四折半即是斤逢零六添之歸實又術以十六兩除之亦得今有兩稅錢四萬三千六百七十五貫二百文抽身内充腳每貫二百文問正及腳各幾何答曰正三萬六千三百九十六貫文腳七千二百七十九貫二百文術曰先置原錢折半六除是正錢數将正錢二因即得腳又術但置錢數身外減二得正倍之得腳今有錢三千四百六十三貫五百文欲毎貫墊四十二文問墊幾何答曰一百四十五貫四百六十七文術曰先置錢數以六七因之退位即得今有絹四十二匹毎匹當錢四貫三百六十六文四分七氂八毫九絲四忽問錢幾何答曰一百八十三貫三百九十二文一分一氂五毫四絲八忽術曰先置絹匹之價以七六因之即得今有錢五千四百六十三貫四百五十文準例毎貫納五十文充墊陌問合墊幾何答曰二百七十三貫一百七十二文五分術曰先置錢折半退位即得又術五因之亦得今有糯米三千四百六十三斛六斗毎斗醖酒一斗四升問酒幾何答曰四千八百四十九斛四升術曰先置米數以二七因之即得又術以四添之亦得今有大豆一萬三千四百五十四斛五斗毎斗造䜴一斗五升問豉幾何答曰二萬一百八十一斛七斗五升術曰先置豆數以五添之即得又術以一斗五升乗之亦得今有小麥五萬六千四百七十三斛五斗毎斗造麴五斤問麴幾何答曰二百八十二萬三千六百七十五斤術曰先置麥數從下五因之即得今有米一萬三千四百六十四斛五斗毎斗糶錢一百二十文問錢幾何答曰一萬六千一百五十七貫四百文術曰先置米數二六因之即得又術以二添之亦得今有米一萬三千四百六十五斛四斗三升毎斗糶錢一百三十五文問錢幾何答曰一萬八千一百七十八貫三百三十文五分術曰先置米數三九因之折半即得又術九因五添亦得今有糙米八千四百六十七斛五斗毎一斗五升碾熟米八升問米幾何答曰米四千五百一十六斛術曰先置糙米數以八因之十五升除之即得今有米三千四百六十三斛四斗四升七合一勺毎斗身内抽三合充腳問正腳各幾何答曰正三千三百六十二斛五斗七升腳一百斛八斗七升七合一勺術曰先置米數以一斗三合除之得正米以三因之得腳米今有糙米三千四百六十四斛五斗七升三合四勺毎斗舂得熟米九升問熟米幾何答曰三千一百一十八斛一斗一升六合六抄術曰先置米數九因退之即得又術但從下内減一亦得今有麻三千四百七十五斛四斗五升毎三斛三斗作油一斛問油幾何答曰一千五十三斛一斗六升三分升之二術曰以三斛三斗除得油數不盡約之為命分今有米三千四百五十六斛毎斗身内抽二升充腳問正腳各幾何答曰正二千二百八十八斛腳五百七十六斛術曰先置米數去二得正米以二因退位得腳米今有兵一萬四千五百七十五人毎人給錢一貫四百四十文問錢幾何答曰二萬九百八十八貫文術曰先置人數添四四即得又術以人數乗一人所給之數得都錢今有兵三千四百八十五人毎人賜絹一丈三尺問絹幾何答曰一千一百三十二匹二丈五尺術曰先置人數添三得丈數以四為法除之得匹今有開城濠深二丈闊三丈長一里毎三尺用一功問功幾何答曰四萬功術曰先置深闊相乗又以長里通尺乗之為實以功數方三尺再自乗為法除之即得今有築城髙三丈上闊一丈五尺下闊二丈五尺長一百丈毎方二尺用一功問功幾何答曰七萬五千功術曰先置上下闊并之折半以髙乗之又以長乗之為實以功數方二尺再自乗為法除之即得
