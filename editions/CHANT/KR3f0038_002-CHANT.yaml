body:
  text: 卷中求地稅今有田三百七十九畝畝出稅穀三升納官每斛加二升耗問輸正及耗各幾何答曰正一十一斛三斗七升耗二斗二升七合四勺術曰置田畝數以三升因之得一十一斛三斗七升為正又二因之得二斗二升七合四勺為耗今有田一畝計稅穀三升問一步合計幾何答曰一步一勺二抄五撮術曰置穀三升再上十之為三百勺以二百四十步為法除之即得今有地收穀一千二百六十二斛九斗六升七合三勺斛別加二升耗問正耗共計幾何答曰一千二百八十九斛二斗四升六合六勺四抄六撮術曰置穀以隔位加二即得今有上官田七十四畝一百五十三步畝別計米六斗輪官官令納穀三斛準米一斛四斗問米及穀各幾何答曰米四十四斛七斗八升二合五勺穀九十五斛九斗六升二合五勺術曰置畝數以二百四十步乘之內餘步得一萬七千九百一十三步為實以上田斛法四百步除之得米數欲求穀者以三斛因米為一百三十四斛三斗四升七合五勺以米一斛四斗除之欲知上田一斛計步數者置田一畝二百四十步以米六斗為法除得四十步計米一斗以斗法上十之為四百步即斛法上田一步計米二合五勺欲知者置米六斗再上十之以二百四十步除之見每步之數今有次官田五十七畝一百五十步畝別計米五斗輸官官亦令納穀三斛準米一斛四斗問米及穀各幾何答曰米二十八斛八斗一升二合五勺穀六十一斛七斗四升二十八分升之三術曰置畝數以二百四十步乘之內一百五十步得一萬三千八百三十步為實以次田法四百八十步除之得米數欲求穀以三斛因米得八十六斛四斗三升七合五勺以米一斛四斗除之得穀數不盡者與法俱倍之命分何以知次田四百八十步為法術曰置二百四十步于上米五斗為法而一得四十八步以為一斗之法上十之為四百八十步即斛法欲知田一步計米二合一十二分合之一術曰置米五斗再上十之為五百合為實以二百四十步除之得二合不盡者退位與法俱半之命分即見每步之法今有下官田八十九畝一百九十五步畝別計米四斗輸官官亦令納穀三斛準米一斛四斗問合計米及穀幾何答曰米三十五斛九斗二升五合穀七十六斛九斗八升一十四分升之三術曰置田畝數以二百四十步乘之內一百九十五步得二萬一千五百五十五步為實以下田斛法六百步除之得米數欲求穀者以三斛因米得一百七斛七斗七升五合為實以一斛四斗除為穀數不盡者命分何以知下田六百步為法術曰置二百四十步以米四斗為法除得六十步為一斗之法上十之為六百步乃為一斛之法欲知下田一步計米一合三分合之二術曰置米四斗再上十之為四百合為實以二百四十步除之得一合不盡者與法俱八約之命分分祿料今有官本錢八百八十貫文每貫月別收息六分計息五十二貫八百文內六百文充公廨食料五十二貫二百文逐官高卑共分太守十分別駕七分司馬五分錄事參軍二人各三分司倉參軍三分司法參軍三分司戶參軍三分參軍二人各二分問各錢幾何答曰太守十分計十二貫七百三十一文四十一分文之二十九別駕七分計八貫九百一十二文四十一分文之八司馬五分計六貫三百六十五文四十一分文之三十五錄事參軍二人各三分各得三貫八百一十九文四十一分文之二十一二人共七貫六百三十九文四十一分文之一司倉參軍三分計三貫八百一十九文四十一分文之二十一司法參軍三分計三貫八百一十九文四十一分文之二十一司戶參軍三分計三貫八百一十九文四十一分文之二十一參軍二人各二分各二貫五百四十六文四十一分文之十四二人共五貫九十二文四十一分文之二十八術曰置本錢八百八十貫文以六因之退二位為息數先除六百文公廨食料餘令諸官均分并諸分得四十一分為法除之得一貫二百七十三文不盡四十一分文之七副置之各以所求分乘之各得其錢及分數今有縣令每月課料七貫三百六十一文五分二氂尋即交承舊官任六日新官任二十四日問新舊官各得幾何答曰舊官得一貫四百七十二文三分四毫新官得五貫八百八十九文二分一氂六毫術曰置錢數以三十日為法除之得一日之錢二百四十五文三分八氂四毫六因之得舊官數又四因之得新官數計給糧今有兵九千五百六十七人人給絹二匹問絹幾何答曰一萬九千一百三十四匹術曰置兵數以二因之即得今有兵六千七百九十二人人給米二升問一日一月一年各幾何答曰一日一百三十五斛八斗四升一月四千七十五斛二斗一年四萬八千九百二斛四斗術曰置兵數以二因之得一日之數上十之得十日之數以三因之得一月之數以十二因之得一年之數今有馬七千六百八十匹匹日給料五升問一日幾何答曰一日三百八十四石術曰置馬匹數以五因之得三萬八千四百升再退為石數今有粟三千八百四十斛欲給馬每匹五升問給幾何答曰給馬七萬六千八百匹術曰置粟數再上十之為升以五升除之得馬匹數今有酒五百六十五斛八斗三升欲給兵每人三升問給幾何答曰給兵一萬八千八百六十一人術曰置酒數再上十之為升以三除之得兵數今有兵八萬人凡五兵共給醬二升問日給幾何答曰日給三百二十斛術曰置兵數以二因之得一十六萬以五兵除之得醬數今有醬二升給五兵見有三百二十斛問給幾何答曰給兵八萬人術曰置醬數再上十之為升以五因之得一十六萬以二升為法除之即得今有兵四萬八千六百二十五人人凡五日給鹽二升問一月幾何答曰一月五千八百三十五斛術曰置兵數以二因之退二等得五日鹽數九百七十二斛五斗求一月數以六因之今有醋三升給七兵見有四百五十七斛問給幾何答曰給兵十萬六千六百三十三人三分人之一術曰置醋數再上十之為升以七因之又以三升除之即得定腳價今有租布一萬三千七百九十五端三丈七尺送納洛州計從州到彼別一十八文充水腳又抽一文充積疊并于數內抽給其布準時估端別一百五十文問正及水腳積疊等三色各幾何答曰正布一萬二千二百四十四端三丈六尺九寸一百六十九分寸之一百三十九水腳一千四百六十九端一丈八尺四寸一百六十九分寸之六十四積疊八十一端三丈一尺五寸一百六十九分寸之一百三十五術曰置元布數倍丈尺以估一百五十文乘得二百六萬九千三百六十一文為實置一百五十文加水腳一十八文又加積疊一文得一百六十九文為法除實得正布一萬二千二百四十四端不盡一百二十五文進位五因之得六千二百五十以下法除之得三丈六尺九寸不盡者與法俱退位得一百六十九分寸之一百三十九為命分也欲知水腳先置元布數倍丈尺寸以水腳一十八文乘之得二十四萬八千三百二十三文三分二氂為實以法一百六十九除得一千四百六十九端不盡六十二文三分二氂進位五因之得三千一百一十六以下法除之得一丈八尺四寸不盡一百六十九分寸之六十四為命分也欲求積疊置元布數倍丈尺寸訖所得以一文因之得一萬三千七百九十五文七分四氂以法除之得八十一端不盡一百六文七分四氂進位以五因之得五千三百三十七以下法除得三丈一尺五寸不盡者與法俱退位得一百六十九分寸之一百三十五為命分也今有布三百九十六端二丈五尺端別一百八十文充腳其布準時估端三百六十文并于數內抽給問正腳各幾何答曰正二百六十四端一丈六尺六寸三分寸之二腳一百三十二端八尺三寸三分寸之一術曰置布數倍丈尺以一百八十文乘之得七萬一千三百七十文為實列腳錢一百八十文并入價錢三百六十文得五百四十文為法實如法得腳端不盡九十文進位因之得四千五百以下法除得八尺三寸不盡者與法俱一十八約之得三分寸之一為命分以減都數餘即正今有布二萬五千四百二十八端二丈七尺欲折布為輕貨絹其絹匹價三貫八百七十文其布端價二貫六百文問為絹幾何答曰絹一萬七千八十三匹三丈九寸一百二十九分寸之五十九術曰置布數倍丈尺以價二貫六百文乘之得六萬六千一百一十四貫二百四文以絹價三貫八百七十文除之得絹匹不盡二千九百九十四文進位四因之得一十一萬九千七百六十以下法除之得三丈九寸不盡者與法俱三約之得一百二十九分寸之五十九今有兩稅米一千五百七十八斛九斗送州每斗腳一十三文并于身內抽充時估斗別一百三十文問正及腳各幾何答曰正米一千四百三十五斛三斗六升一十一分升之四腳米一百四十三斛五斗三升一十一分升之七術曰置米數以每石一百三十文乘之為實又置一百三十文加腳一十三文得一百四十三文為法除得正米數欲求腳米數以每斗一十三文乘稅數為實以一百四十三文為法除之即腳數今有兩稅錢一千五百二十四貫二百四十文送州每貫一十七文七分充腳于身內抽給問正錢及腳價各幾何答曰正錢一千四百九十七貫七百三十文一萬一百七十七分文之一千七百九十腳價二十六貫五百九文一萬一百七十七分文之八千三百八十七術曰置稅錢數以一貫文加一十七文七分為一貫一十七文七分為法除之得正錢數欲求腳價以一十七文七分為法乘正錢得腳價稱輕重今有戶五百六十五戶別納絲一斤一十一兩八銖問得絲幾何答曰八石五斤三兩八銖術曰置戶數下列二十七兩以二十四銖乘之內八銖為六百五十六銖以乘戶數得三十七萬六百四十銖以二十四銖為法除得一萬五千四百四十三兩零八銖以一十六兩為法除得九百六十五斤三兩以三十斤為法除得三十二鈞五斤三兩以四鈞為法除得八石五斤三兩八銖今有丁一千八百六十五人人納絲一斤一十三兩一十七銖問絲幾何答曰絲三千四百六十二斤一十四兩一銖術曰置丁數又以絲一斤二而八之為一十六兩內十三兩三而八之內一十七銖為七百一十三銖以乘丁數得一百三十二萬九千七百四十五銖以二十四銖為法除得五萬五千四百六兩一銖以一十六兩為法除得三千四百六十二斤一十四兩一銖今有生鐵六千二百八十一斤欲鍊為黃鐵每斤耗五兩問為黃鐵幾何答曰黃鐵四千三百一十八斤三兩術曰置生鐵數以一十一兩乘以一十六除之即得今有黃鐵四千三百一十八斤三兩欲鍊為鋼鐵每斤耗三兩問鋼鐵幾何答曰鋼鐵三千五百八斤八兩一十銖五絫術曰置黃鐵數以一十三兩乘之一十六兩除之即得今有鋼鐵二千五百斤依前所耗數欲求為黃鐵問得幾何答曰黃鐵三千七十六斤一十四兩一十三分兩之一十術曰置鋼鐵數一十六乘之一十三除之即得今有黃鐵三千七十六斤一十四兩一十三分兩之一十欲求鋼鐵問得幾何答曰二千五百斤術曰置黃鐵數一十三乘之一十六除之即得今有官銀三千四百六十二斤一十四兩一銖充賞賜兵一千八百六十五人問人得幾何答曰人得一斤一十三兩一十七銖術曰置銀斤以二而八之內一十四兩又三而八之內一銖得一百三十二萬九千七百四十五銖以兵數除之得七百一十三銖以二十四銖為法除之得二十九兩一十七銖以一十六兩為法除之得一斤一十三兩一十七銖
