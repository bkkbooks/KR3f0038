body:
  text: 夏侯陽算經提要夏侯陽算經三卷臣等謹案隋經籍志有夏侯陽算經二卷唐藝文志列夏侯陽算經一卷甄鸞注又韓延夏侯陽算經一卷韓延似作注者姓名而直齋書錄觧題載元豐京監本乃云三卷無注盖傳冩互有分合故卷帙各異也然皆不言陽為何代人考陽自序有云五曹孫子述作滋多甄鸞劉徽為之詳釋則其人在甄鸞後唐書甄鸞注三字殆因序文而誤歟書内又稱宋元嘉二年徐受重鑄銅斛至梁大同元年甄鸞校之則陽疑隋初人去梁稍逺故目梁時斗尺為古所用其辯度量衡云在京諸司及諸州各給稱尺并五尺度斗升合等様皆銅為之倉庫令諸量函所在官造大者五斛中者三斛小者一斛以鐵為縁勘平印書然後給用及課租庸調章稱賦役令論步數不等章稱雜令田令之屬皆據隋制言之則陽為隋人盖無可疑唐書選舉志所列算書十種此居其一盖當時本懸之令甲肄習考課今傳本久佚惟永樂大典内有之然逐條割裂分附九章算術各類之下幾扵治絲而棼猝不得其端緒幸尚載原序原目猶可以尋繹編次條貫其文今裒輯排比仍依元豐監本釐為三卷其十有二門亦從原目其書務切實用雖九章古法非官曹民事所必需者亦畧而不載扵諸算經中最為簡要且扵古今制度異同多資考證尤足寶重云乾隆四十年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
