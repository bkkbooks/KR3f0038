body:
  text: 說諸分一今有黃金一斤直絹一千二百匹問每兩直絹幾何答曰一兩直絹七十五匹術曰置絹數以一十六兩除之即得二今有絲一百九十二兩問為銖幾何答曰四千六百八銖術曰置絲數以二十四乘之即得三今有錦一匹直錢十八貫問丈尺寸各得幾何答曰一丈四貫五百文一尺四百五十文一寸四十五文術曰置錢數以四丈除之得丈價一退為尺價再退為寸價四今有金一斤直錢一百貫問一兩幾何答曰一兩六貫二百五十文術曰置錢數以十六兩除之即得五今有金一斤令五十人分之問人得幾何答曰人得七銖六絫八黍術曰置金一斤二而八之為兩三而八之為銖以人數除之即得六今有絲三百二十四斤欲九兩為絹一匹問絹幾何答曰五百七十六匹術曰置絲斤數二而八之以九而一即得七今有下戶缺錢一百二十三貫五百文準條於上戶均攤今有上戶見在錢三萬一千二百五十貫文問合每貫均著幾何答曰每貫三文九分五釐二毫術曰置下戶錢數以上戶見在錢除之即得八今有錢一十七貫五百二十五文欲五文買雞三隻問得幾何答曰得雞一萬五百一十五隻術曰置錢數以三因之五而一即得九今有錢二貫四百文買錫一斤問兩銖絫各幾何答曰兩一百五十文銖六文二分五釐絫六分二釐五毫術曰置錢數以十六除之得兩價欲知銖價即置兩價以二十四除為銖價退銖價一等為絫價一今有十五家共納兩稅錢一十貫文甲三人人各一貫文乙五人人各七百文丙七人人各五百文續奉符令都卻還七貫三百問隨元納數給付各幾何答曰甲三人各還七百三十文各有二百七十文在乙五人各還五百一十一文各有一百八十九文在丙七人人各還三百六十五文各有一百三十五文在術曰置卻還數以百除之所得為每百還錢之數置百文減之餘為每百錢在庫之數各置此數以各人所納錢數乘之各得其數一一今有絹一千五百二十五匹三丈七尺五寸欲送州每匹一十五文充腳並於身內抽給其絹時估每匹一貫一百文問正及腳各幾何答曰正一千五百五匹一丈六尺三寸二百二十三分寸之一百五十一腳二十匹二丈一尺一寸二百二十三分寸之七十二術曰置絹數於丈尺已下折半五因以時估一貫一百文乘得一千六百七十八貫五百三十一文二分五釐復置一貫一百文加一十五文為法除得一千五百五匹不盡四百五十六文二分五釐進位四因之得一萬八千二百五十以下法除之得一丈六尺三寸不盡者與法退位倍之得二百二十三分寸之一百五十一欲知腳價者置元絹數丈尺寸折半五因又以腳錢一十五文乘之得二萬二千五因又以腳錢一十五文乘之五因又以腳錢一十五文乘之得二萬二千八百八十九文六釐二毫半以一貫一百一十五文為法除得二十匹不盡五百八十九文六釐二毫半進位四因之得二萬三千五百六十二文半以下法除之得二丈一尺一寸不盡者如前約之得二百二十三分寸之七十二一二今有絹一匹當腳一十五文問丈尺寸各幾何答曰丈三文七分五釐尺三分七釐五毫寸三釐七毫五絲術曰置腳一十五文以四丈除之得一丈腳數退一等得尺再退得寸腳數一三今有絹一匹直一貫一百文問丈尺寸各幾何答曰丈二百七十五文尺二十七文五分寸二文七分五釐術曰置錢數以四丈除之得丈價一退得尺價再退得寸價一四今有米二千五百六十七斛五斗其米粗欲再舂每八升耗一升問合得熟米幾何答曰熟米二千二百四十六斛五斗六升二合五勺術曰置米數以七因八除得數返求米以八因七除一五今有米一千五百三十二斛七斗欲貸與人每八升加息一升問本息共幾何答曰一千七百二十四斛二斗八升七合五勺術曰置米數以九因八除之若求元數八因九除之一六今有兩稅錢二千貫文欲送州每貫數內抽一十文充腳問正及腳各幾何答曰正一千九百八十貫一百九十八文一百一分文之二腳一十九貫八百一文一百一分文之九十九術曰置錢數下置一貫文又加腳十文為法除之得正數卻減都錢餘即腳錢一七今有紬五千六百二十五匹匹欲作復七條問合幾何答曰三萬九千三百七十五條術曰置紬數以七因之即得一八今有金方一寸重一斤有金方六寸問重幾何答曰二百一十六斤術曰置金寸數再乘之即得一九今有絹二千四百五十四匹每匹直錢一貫七百文問計錢幾何答曰四千一百七十一貫八百文術曰先置絹數七添之退位一等即得二今有布一萬三千四百六十三端二丈五尺六寸每端直錢一貫八百文問計錢幾何答曰二萬四千二百三十四貫三百二十一文六分術曰先置布數丈尺倍之從下八添直至數首退一等即得又術退位減一餘以二因之並得二一今有布積尺一萬八千四百六十三尺四寸二分問為端幾何答曰三百六十九端一丈三尺四寸二分術曰先置尺數以五十尺除之即得二二今有絹三千四百六十三匹一丈三尺四寸每匹三貫五百文問計錢幾何答曰一萬二千一百二十一貫六百七十二文五分術曰先置絹數丈尺已下折半五因以五七因之即得又術從頭七因訖折半即得二三今有絹積尺一萬三千四百六十三尺五寸四分問為匹幾何答曰三百三十六匹二丈三尺五寸四分術曰先置積尺數以匹四十尺為法除之即得二四今有絲一千五百二十五斤每兩一百七十文問錢幾何答曰四千一百四十八貫術曰先置絲數以二八因之以兩價乘之即得又術添七亦得二五今有絲三千四百八十五兩令織紗一匹用絲五兩問得紗幾何答曰六百九十七匹術曰先置絲數以二因之退位一等即得又術以五兩除之並得二六今有絲一萬三千四百六十七兩問斤幾何答曰八百四十一斤一十一兩術曰先置絲兩數四折半即是斤逢零六添之歸實又術以十六除之亦得二七今有兩稅錢四萬三千六百七十五貫二百文抽身內充腳每貫二百文問正及腳各幾何答曰正三萬六千三百九十六貫文腳七千二百七十九貫二百文術曰先置元錢折半六除是正錢數將正錢二因即得腳又術但置錢數身外減二得正倍之得腳二八今有錢三千四百六十三貫五百文欲每貫墊四十二文問墊幾何答曰一百四十五貫四百六十七文術曰先置錢數以六七因之退位即得二九今有絹四十二匹每匹當錢四貫三百六十六文四分七釐八毫九絲四忽問錢幾何答曰一百八十三貫三百九十二文一分一釐五毫四絲八忽術曰先置絹匹之價以七六因之即得三今有錢五千四百六十三貫四百五十文準例每貫納五十文充墊陌問合墊幾何答曰二百七十三貫一百七十二文五分術曰先置錢折半退位即得又術五因之亦得三一今有糯米三千四百六十三斛六斗每斗醖酒一斗四升問酒幾何答曰四千八百四十九斛四升術曰先置米數以二七因之即得又術以四添之亦得三二今有大豆一萬三千四百五十四斛五斗每斗造䜴一斗五升問豉幾何答曰二萬一百八十一斛七斗五升術曰先置豆數以五添之即得又術以一斗五升乘之亦得三三今有小麥五萬六千四百七十三斛五斗每斗造麴五斤問麴幾何答曰二百八十二萬三千六百七十五斤術曰先置麥數從下五因之即得三四今有米一萬三千四百六十四斛五斗每斗一百二十文問錢幾何答曰一萬六千一百五十七貫四百文術曰先置米數二六因之即得又術以二添之亦得今有米一萬三千四百六十五斛四斗三升每斗一百三十五文問錢幾何答曰一萬八千一百七十八貫三百三十文五分術曰先置米數三九因之折半即得又術九因五添亦得三六今有糙米八千四百六十七斛五斗每一斗五升碾熟米八升問米幾何答曰米四千五百一十六斛術曰先置糙米數以八因之十五除之即得三七今有米三千四百六十三斛四斗四升七合一勺每斗身內抽三合充腳問正及腳各幾何答曰正三千三百六十二斛五斗七升腳一百斛八斗七升七合一勺術曰先置米數以一斗三合除之得正米以三因之得腳米三八今有糙米三千四百六十四斛五斗七升三合四勺每斗舂得熟米九升問熟米幾何答曰三千一百一十八斛一斗一升六合六抄術曰先置米數九因退之即得又術但從十內減一亦得三九今有麻三千四百七十五斛四斗五升每三斛三斗作油一斛問油幾何答曰一千五十三斛一斗六升三分升之二術曰以三斛三斗除得油數不盡約之為命分四今有米三千四百五十六斛每斗身內抽二升充腳問正腳各幾何答曰正二千八百八十斛腳五百七十六斛術曰先置米數去二得正米以二因退位得腳米四一今有兵一萬四千五百七十五人每人給錢一貫四百四十文問錢幾何答曰二萬九百八十八貫文術曰先置人數添四四即得又術以人數乘一人所給之數得都錢四二今有兵三千四百八十五人每人賜絹一丈三尺問絹幾何答曰一千一百三十二匹二丈五尺術曰先置人數添三得丈數以四為法除之得匹四三今有開城濠深二丈闊三丈長一里每方三尺用一功問功幾何答曰四萬功術曰先置深闊相乘又以長里通尺乘之為實以功數方三尺再自乘為法除之即得四四今有築城高三丈上闊一丈五尺下闊二丈五尺長一百丈每方二尺用一功問功幾何答曰七萬五千功術曰先置上下闊並之折半以高乘之又以長乘之為實以功數方二尺再自乘為法除之即得
